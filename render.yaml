services:
  - type: web
    name: vavuubey-secure
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: ACCESS_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
